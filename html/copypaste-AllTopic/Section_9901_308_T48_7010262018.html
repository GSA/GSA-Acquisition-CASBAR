    <h1 class="title topictitle1" id="ariaid-title1">9901.308 Meetings.</h1>
    <div class="body conbody">
      <p class="p">The Board shall meet at the call of the Chairman. Agenda for Board meetings shall be proposed by the Chairman, but any Board member may request any item to be placed on the agenda.


</p>
